<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML and CSS Fundamentals Quiz</h1>
    </header>

    <main>
        <form action="#" method="post">

            <!-- Question 1: Text Input -->
            <div class="form-item">
                <label for="q1">1. What HTML tag is used to create a top-level heading?</label>
                <input type="text" id="q1" name="q1" placeholder="e.g., <h1>" required>
            </div>

            <!-- Question 2: Textarea -->
            <div class="form-item">
                <label for="q2">2. Explain the difference between padding and margin in CSS:</label>
                <textarea id="q2" name="q2" rows="4" placeholder="Type your answer here..."
                  required></textarea>
            </div>

            <!-- Question 3: Select Dropdown -->
            <div class="form-item">
                <label for="q3">3. Which CSS property is used to change the text color of an
                    element?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="font-style">font-style</option>
                    <option value="color">color</option>
                    <option value="background-color">background-color</option>
                    <option value="text-align">text-align</option>
                </select>
            </div>

            <!-- Question 4: Number Input -->
            <div class="form-item">
                <label for="q4">4. How many heading levels exist in standard HTML (1 through
                    ?)?</label>
                <input type="number" id="q4" name="q4" min="1" max="10" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Quiz</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 HTML & CSS Quiz Form | WDD130</p>
    </footer>
</body>

</html>
