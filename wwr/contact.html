<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Adventures</title>
    <meta name="description"
      content="Get in touch with Whitewater Rafting Adventures. Find our office address, phone number, email, employee contacts, and send us a message through our contact form.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!-- Header, Nav, and Footer remain unchanged for site consistency -->
    <header>
        <img src="images/logo.png" alt="Whitewater Rafting Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main class="contact-main">
        <h1>Contact Whitewater Rafting Adventures</h1>

        <!-- Section 1: Company Info & Map -->
        <section class="company-info">
            <div class="info-details">
                <h2>Get in Touch</h2>
                <p><strong>Address:</strong> 123 River Run Way, Boise, ID 83702</p>
                <p><strong>Phone:</strong> (208) 555-0199</p>
                <p><strong>Email:</strong> info@wwradventures.com</p>
            </div>
            <div class="map-container">
                <!-- Google Map iframe without inline style="border:0" -->
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d184852.12628434825!2d-116.35313010777174!3d43.61370929280628!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54aef170e917b203%3A0x89b0471f54b1f417!2sBoise%2C%20ID!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  width="100%" height="250" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>

        <!-- Section 2: Employee Profiles -->
        <section class="employee-profiles">
            <h2>Meet Our Team</h2>
            <div class="profile-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Sarah Jenkins">
                    <figcaption><strong>Sarah Jenkins</strong><br>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Marcus Vance">
                    <figcaption><strong>Marcus Vance</strong><br>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Elena Rostova">
                    <figcaption><strong>Elena Rostova</strong><br>Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>

        <!-- Section 3: Contact Form -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">

                <!-- User Name -->
                <div class="form-item">
                    <label for="username">Full Name:</label>
                    <input type="text" id="username" name="username" placeholder="Jane Doe"
                      required>
                </div>

                <!-- User Email -->
                <div class="form-item">
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail"
                      placeholder="jane@example.com" required>
                </div>

                <!-- Purpose of Message (Radio Buttons) -->
                <fieldset class="form-item radio-group">
                    <legend>Purpose of Message:</legend>
                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <!-- Message Input -->
                <div class="form-item">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Write your message here..." required></textarea>
                </div>

                <!-- Newsletter Checkbox -->
                <div class="form-item checkbox-item">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Send Message</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Whitewater Rafting Adventures | WDD130</p>
    </footer>
</body>

</html>
